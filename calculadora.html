<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Calculadora de Volumen</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculadora {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .calcular {
            background-color: #333;
        }

        .calcular:hover {
            background-color: #555;
        }

        .limpiar {
            background-color: #888;
        }

        .limpiar:hover {
            background-color: #666;
        }

        #resultado {
            margin-top: 25px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        #formula {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .error {
            color: #c62828;
            font-size: 15px;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <div class="calculadora">

        <h1>📐 Volumen de cilindro</h1>


        <label>Diámetro (m)</label>

        <input
            type="number"
            id="diametro"
            step="0.01"
            placeholder="Ej: 1.20"
        >


        <label>Altura (m)</label>

        <input
            type="number"
            id="altura"
            step="0.01"
            placeholder="Ej: 4.60"
        >


        <div class="botones">

            <button
                class="calcular"
                onclick="calcular()">
                Calcular
            </button>

            <button
                class="limpiar"
                onclick="limpiar()">
                Limpiar
            </button>

        </div>


        <div id="resultado"></div>

        <div id="formula"></div>

        <div id="error" class="error"></div>

    </div>


    <script>

        function calcular() {

            // Obtener los valores ingresados

            let diametro =
                Number(document.getElementById("diametro").value);

            let altura =
                Number(document.getElementById("altura").value);


            // Limpiar mensajes anteriores

            document.getElementById("error").innerHTML = "";
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("formula").innerHTML = "";


            // Validar los datos

            if (diametro <= 0 || altura <= 0) {

                document.getElementById("error").innerHTML =
                    "⚠️ Ingresa valores mayores que cero.";

                return;
            }


            // Calcular radio

            let radio = diametro / 2;


            // Calcular volumen

            let volumen =
                Math.PI * radio * radio * altura;


            // Mostrar resultado

            document.getElementById("resultado").innerHTML =
                "Volumen = " + volumen.toFixed(3) + " m³";


            // Mostrar fórmula

            document.getElementById("formula").innerHTML =
                "V = π × r² × h";

        }


        function limpiar() {

            document.getElementById("diametro").value = "";

            document.getElementById("altura").value = "";

            document.getElementById("resultado").innerHTML = "";

            document.getElementById("formula").innerHTML = "";

            document.getElementById("error").innerHTML = "";

        }

    </script>

</body>

</html>
